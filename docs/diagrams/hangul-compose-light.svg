<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="hangul-compose-light-title hangul-compose-light-desc">
<title id="hangul-compose-light-title">한글 음절 계산식과 NFD 분해</title>
<desc id="hangul-compose-light-desc">초성 ㅎ, 중성 ㅏ, 종성 ㄴ을 계산식으로 합쳐 U+D55C 한을 만들고 UTF-8 3바이트로 쓴다. 같은 글자를 NFD로 풀면 9바이트가 되고 GLM-5.3은 9개 토큰으로 쪼갠다.</desc>
<defs>
<style>
.sans { font-family: 'Geist', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', monospace; }
.serif { font-family: 'Instrument Serif', 'Noto Serif KR', serif; }
</style>
<marker id="hangul-compose-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
