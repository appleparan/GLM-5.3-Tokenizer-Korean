<text x="124" y="166" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">ㅏ · index 0 of 21</text>
<rect x="40" y="192" width="168" height="48" rx="6" fill="#ffffff"/>
<rect x="40" y="192" width="168" height="48" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
<text x="124" y="212" fill="#2d3142" font-size="12" class="sans" text-anchor="middle" font-weight="600">종성 (final)</text>
<text x="124" y="230" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">ㄴ · index 4 of 28</text>
<rect x="264" y="96" width="248" height="112" rx="6" fill="#ffffff"/>
<rect x="264" y="96" width="248" height="112" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="1" stroke-width="1"/>
