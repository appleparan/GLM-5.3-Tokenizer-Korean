<text x="640" y="158" fill="#2d3142" font-size="12" class="mono" text-anchor="middle" font-weight="600">U+D55C '한'</text>
<text x="640" y="176" fill="#7a8399" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">NFC</text>
<rect x="768" y="120" width="152" height="64" rx="6" fill="#ffffff"/>
<rect x="768" y="120" width="152" height="64" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
<text x="844" y="136" fill="#7a8399" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">UTF-8</text>
<text x="844" y="158" fill="#2d3142" font-size="12" class="mono" text-anchor="middle" font-weight="600">ED 95 9C</text>
<text x="844" y="176" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">3 bytes</text>
<rect x="40" y="328" width="208" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="328" width="208" height="64" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
<text x="144" y="344" fill="#7a8399" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">NFD</text>
<text x="144" y="366" fill="#2d3142" font-size="12" class="mono" text-anchor="middle" font-weight="600">U+1112 U+1161 U+11AB</text>
<text x="144" y="384" fill="#4f5d75" font-size="12" class="sans" text-anchor="middle">자모 3글자</text>
<rect x="304" y="328" width="256" height="64" rx="6" fill="#ffffff"/>
<rect x="304" y="328" width="256" height="64" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
<text x="432" y="344" fill="#7a8399" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">UTF-8</text>
<text x="432" y="366" fill="#2d3142" font-size="12" class="mono" text-anchor="middle" font-weight="600">E1 84 92 E1 85 A1 E1 86 AB</text>
<text x="432" y="384" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">9 bytes</text>
