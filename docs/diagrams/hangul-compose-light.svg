<text x="388" y="148" fill="#2d3142" font-size="12" class="mono" text-anchor="middle">0xAC00 + (18×21 + 0)×28 + 4</text>
<text x="388" y="172" fill="#7a8399" font-size="8" class="mono" text-anchor="middle">0xAC00 + (초성×21 + 중성)×28 + 종성</text>
<text x="388" y="192" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">= 0xD55C</text>
<rect x="568" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
<rect x="568" y="120" width="144" height="64" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
