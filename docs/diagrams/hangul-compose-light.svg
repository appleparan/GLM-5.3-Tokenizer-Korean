<text x="380" y="266" fill="#7a8399" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NFD 분해</text>
<rect x="40" y="64" width="168" height="48" rx="6" fill="#ffffff"/>
<rect x="40" y="64" width="168" height="48" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
<text x="124" y="84" fill="#2d3142" font-size="12" class="sans" text-anchor="middle" font-weight="600">초성 (initial)</text>
<text x="124" y="102" fill="#4f5d75" font-size="12" class="mono" text-anchor="middle">ㅎ · index 18 of 19</text>
<rect x="40" y="128" width="168" height="48" rx="6" fill="#ffffff"/>
<rect x="40" y="128" width="168" height="48" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/>
