<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="tokenizer-pipeline-light-title tokenizer-pipeline-light-desc">
<title id="tokenizer-pipeline-light-title">GLM-5.3 토크나이저 처리 순서</title>
<desc id="tokenizer-pipeline-light-desc">입력 '안녕 你好'가 정규식 분할, UTF-8 변환, ByteLevel 매핑, BPE 병합, 토큰 ID 순서로 처리된다. 한글이 불리해지는 단계는 BPE 병합 하나다.</desc>
<defs>
<style>
.sans { font-family: 'Geist', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', monospace; }
.serif { font-family: 'Instrument Serif', 'Noto Serif KR', serif; }
</style>
<marker id="tokenizer-pipeline-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="tokenizer-pipeline-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
